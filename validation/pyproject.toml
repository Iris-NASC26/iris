[project]
name = "earth-trend-scientific-reference"
version = "0.1.0"
description = "F04 independent validation tools; never an application dependency"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "pymannkendall==1.4.3",
  "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["reference", "tests"]
ignore_missing_imports = true
