# Local pre-deployment testing stack (no domain or TLS required).
# Run from the deployment/ directory:
#   docker compose -f docker-compose.local.yml up --build -d
name: iris-local

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "3000:3000" # Dashboard via Caddy reverse proxy -> http://localhost:3000
      - "3001:3001" # Static documentation site        -> http://localhost:3001
    volumes:
      - ../documentation:/srv/docs:ro
    command:
      - sh
      - -c
      - |
        cat <<'EOF' > /tmp/Caddyfile.local
        {
          auto_https off
        }
        :3000 {
          encode zstd gzip
          reverse_proxy frontend:3000 {
            transport http {
              response_header_timeout 300s
            }
          }
        }
        :3001 {
          encode zstd gzip
          root * /srv/docs
          file_server
        }
        EOF
        caddy run --config /tmp/Caddyfile.local --adapter caddyfile
    depends_on:
      frontend:
        condition: service_healthy
    networks: [web]

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
      args:
        NEXT_PUBLIC_DOCS_URL: http://localhost:3001
    restart: unless-stopped
    environment:
      FASTAPI_URL: http://backend:8000
      FASTAPI_BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks: [web, internal]

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      FORECAST_REFRESH_ENABLED: ${FORECAST_REFRESH_ENABLED:-false}
    volumes:
      - iris_local_artifacts:/app/artifacts
      - iris_local_data:/app/backend/data
    networks: [internal]

volumes:
  iris_local_artifacts:
  iris_local_data:

networks:
  web:
  internal:
